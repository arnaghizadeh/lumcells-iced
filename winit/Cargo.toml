[package]
name = "iced_winit"
description = "A runtime for iced on top of winit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["x11", "wayland"]
debug = ["iced_debug/enable"]
sysinfo = ["dep:sysinfo"]
unconditional-rendering = []
linux-theme-detection = ["dep:mundy", "mundy/async-io", "mundy/color-scheme"]
# The tray icon: StatusNotifierItem over D-Bus on Linux, `tray-icon` on macOS and Windows
tray = ["dep:zbus", "dep:png", "dep:tray-icon"]
# The accessibility tree, for screen readers: AccessKit
accessibility = ["dep:accesskit", "dep:accesskit_winit", "dep:unicode-segmentation"]
# One instance of the program per user: a second start hands its arguments to the first
single-instance = ["dep:interprocess"]
x11 = ["winit/x11", "window_clipboard/x11"]
# `window::present` on Wayland (xdg-activation for an existing window) talks to the compositor on the connection of `winit`, with the crates `winit` uses
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita", "window_clipboard/wayland", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols"]

[dependencies]
iced_debug.workspace = true
iced_program.workspace = true

log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
window_clipboard.workspace = true
winit.workspace = true

sysinfo.workspace = true
sysinfo.optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit.workspace = true
accesskit.optional = true
accesskit_winit.workspace = true
accesskit_winit.optional = true
unicode-segmentation.workspace = true
unicode-segmentation.optional = true
interprocess.workspace = true
interprocess.optional = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
web-sys.features = ["Document", "Window", "HtmlCanvasElement"]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mundy.workspace = true
mundy.optional = true
zbus.workspace = true
zbus.optional = true
# The pictures of the items of the tray menu, as `com.canonical.dbusmenu` wants them
png.workspace = true
png.optional = true
wayland-backend.workspace = true
wayland-backend.optional = true
wayland-client.workspace = true
wayland-client.optional = true
wayland-protocols.workspace = true
wayland-protocols.optional = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon.workspace = true
tray-icon.optional = true

[dev-dependencies]
png.workspace = true
iced_futures.workspace = true
iced_futures.features = ["thread-pool"]
